{% extends "index.html" %}

{% block content %}

<div class="container mt-5 mb-5">
    <div class="card shadow rounded-4 border-0">
        <div class="card-body p-4">
            <h2 class="mb-4 text-primary">
                <i class="bi bi-ui-checks-grid me-2"></i>Neue Multiple-Choice-Frage anlegen
            </h2>

            <form id="multipleChoiceFrageForm" autocomplete="off">
                <div class="mb-3">
                    <label for="bez" class="form-label">
                        Identifikator
                        <i class="bi bi-info-circle-fill ms-2 text-info"
                           data-bs-toggle="tooltip"
                           title="Ein kurzer, eindeutiger Name (z.B. MCF01), der diese Frage im System identifiziert."></i>
                    </label>
                    <input type="text"
                           class="form-control rounded-3"
                           id="bez"
                           name="bez"
                           required
                           placeholder="z.B. MCF01">
                </div>

                <div class="mb-3">
                    <label for="text" class="form-label">
                        Fragetext
                        <i class="bi bi-info-circle-fill ms-2 text-info"
                           data-bs-toggle="tooltip"
                           title="Formulieren Sie die Multiple-Choice-Frage so, wie sie den Nutzern angezeigt werden soll."></i>
                    </label>
                    <textarea class="form-control rounded-3"
                              id="text"
                              name="text"
                              rows="3"
                              required
                              placeholder="Geben Sie die vollständige Frage ein..."></textarea>
                </div>

                <div class="mb-3">
                    <label for="bem" class="form-label">
                        Ergänzung/Hinweis/Bemerkung
                        <i class="bi bi-info-circle-fill ms-2 text-info"
                           data-bs-toggle="tooltip"
                           title="Hier können Sie zusätzliche Hinweise oder Hilfestellungen hinterlegen. (optional)"></i>
                    </label>
                    <textarea class="form-control rounded-3"
                              id="bem"
                              name="bem"
                              rows="2"
                              placeholder="z.B. Hinweise zur Beantwortung..."></textarea>
                </div>

                <div class="mb-4">
                    <label for="ziel" class="form-label">
                        Nächstes Element
                        <i class="bi bi-info-circle-fill ms-2 text-info"
                           data-bs-toggle="tooltip"
                           title="Optional: Dieses Element wird angezeigt, sobald mindestens eine Antwortmöglichkeit ausgewählt wurde."></i>
                    </label>
                    <select class="form-select rounded-3" id="ziel" name="ziel">
                        <option value="">-- kein nächstes Element --</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="initial" class="form-label">
                        Ist dies die Startfrage?
                        <i class="bi bi-info-circle-fill ms-2 text-info"
                           data-bs-toggle="tooltip"
                           title="Wählen Sie 'Ja', wenn dies der Startpunkt des Entscheidungsbaums sein soll."></i>
                    </label>
                    <select class="form-select rounded-3 w-auto d-inline-block"
                            id="initial"
                            name="initial">
                        <option value="0">Nein</option>
                        <option value="1">Ja</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary px-4 rounded-3 shadow-sm">
                    <i class="bi bi-save me-1"></i>Speichern
                </button>
            </form>

            <p id="statusMessage" class="mt-3 mb-0" role="status" aria-live="polite"></p>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (element) {
            new bootstrap.Tooltip(element);
        });

        const form = document.getElementById("multipleChoiceFrageForm");
        const statusMessage = document.getElementById("statusMessage");

        function showStatus(message, successful) {
            statusMessage.textContent = message;
            statusMessage.className = successful
                ? "mt-3 mb-0 text-success"
                : "mt-3 mb-0 text-danger";
        }

        fetch("/all_bez")
            .then(response => response.json())
            .then(elements => {
                const zielSelect = document.getElementById("ziel");
                elements.forEach(element => {
                    zielSelect.add(new Option(`${element.Bez} (${element.type})`, element.ID));
                });
            })
            .catch(() => showStatus("Die möglichen Nachfolger konnten nicht geladen werden.", false));

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            statusMessage.textContent = "";

            const formData = {
                bez: document.getElementById("bez").value.trim(),
                text: document.getElementById("text").value.trim(),
                bem: document.getElementById("bem").value.trim(),
                ziel: document.getElementById("ziel").value || null,
                initial: document.getElementById("initial").value
            };

            try {
                const response = await fetch("/save_multiple_choice_frage", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData)
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Die Frage konnte nicht gespeichert werden.");
                }

                showStatus(data.message || "Multiple-Choice-Frage wurde gespeichert.", true);
                form.reset();
            } catch (error) {
                console.error("Fehler beim Speichern:", error);
                showStatus(error.message || "Beim Speichern ist ein Fehler aufgetreten.", false);
            } finally {
                submitButton.disabled = false;
            }
        });
    });
</script>

{% endblock %}
