{% extends 'index.html' %}

{% block content %}
<div class="container mt-5 mb-5">
  <div class="card shadow rounded-4 border-0">
    <div class="card-body p-4">
      <h2 class="mb-4 text-primary"><i class="bi bi-pencil-square me-2"></i>Multiple-Choice-Item bearbeiten</h2>
      <form id="itemForm" autocomplete="off">
        <div class="mb-4">
          <label for="itemSelect" class="form-label">Item auswählen</label>
          <select id="itemSelect" class="form-select rounded-3" required>
            <option value="">-- Bitte wählen --</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="frage" class="form-label">Multiple-Choice-Frage</label>
          <input id="frage" class="form-control rounded-3" type="text" disabled>
        </div>
        <div class="mb-3">
          <label for="text" class="form-label">Antwortmöglichkeit</label>
          <textarea id="text" class="form-control rounded-3" rows="2" required></textarea>
        </div>
        <div class="mb-4">
          <label for="position" class="form-label">Position</label>
          <input id="position" class="form-control rounded-3" type="number" min="1" step="1" required>
        </div>
        <button type="submit" class="btn btn-primary px-4 rounded-3 shadow-sm"><i class="bi bi-arrow-repeat me-1"></i>Aktualisieren</button>
        <a href="/graph" class="btn btn-primary px-4 rounded-3 shadow-sm ms-2"><i class="bi bi-diagram-3 me-1"></i>Graph</a>
      </form>
      <p id="statusMessage" class="mt-3 mb-0" role="status"></p>
    </div>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const form = document.getElementById("itemForm");
    const select = document.getElementById("itemSelect");
    const status = document.getElementById("statusMessage");
    let items = [];

    async function loadList(selectedId) {
      const response = await fetch("/all_multiple_choice_items");
      if (!response.ok) throw new Error("Die Multiple-Choice-Items konnten nicht geladen werden.");
      items = await response.json();
      select.innerHTML = '<option value="">-- Bitte wählen --</option>';
      items.forEach(item => select.add(new Option(`${item.FrageBez} · ${item.Position}: ${item.Text}`, item.ID)));
      if (selectedId) select.value = selectedId;
    }

    function showItem(id) {
      const item = items.find(entry => String(entry.ID) === String(id));
      document.getElementById("frage").value = item ? `${item.FrageBez}: ${item.FrageText}` : "";
      document.getElementById("text").value = item?.Text || "";
      document.getElementById("position").value = item?.Position || "";
      status.textContent = "";
    }

    select.addEventListener("change", () => showItem(select.value));
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!select.value) { status.textContent = "Bitte zuerst ein Item auswählen."; return; }
      const response = await fetch("/update_multiple_choice_item", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({id: Number(select.value), text: document.getElementById("text").value.trim(), position: Number(document.getElementById("position").value)})
      });
      const data = await response.json();
      status.textContent = data.message;
      status.className = response.ok ? "mt-3 mb-0 text-success" : "mt-3 mb-0 text-danger";
      if (response.ok) await loadList(select.value);
    });

    try { await loadList(new URLSearchParams(window.location.search).get("id")); showItem(select.value); }
    catch (error) { status.textContent = error.message; status.className = "mt-3 mb-0 text-danger"; }
  });
</script>
{% endblock %}
